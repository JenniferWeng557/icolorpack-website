<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - iColorPack</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --black: #0D0D0D;
      --white: #FFFFFF;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      border: 1px solid rgba(201, 168, 76, 0.3);
      background: rgba(255, 255, 255, 0.05);
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 30px;
      display: block;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--gold);
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
      color: rgba(255, 255, 255, 0.8);
    }
    .btn-home {
      display: inline-block;
      padding: 15px 40px;
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .btn-home:hover {
      background: var(--white);
    }
  
    /* WIDGETS */
    .floating-whatsapp {
      position: fixed; bottom: 40px; left: 40px; z-index: 2000;
      width: 55px; height: 55px; background: #25D366; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3); transition: 0.3s ease;
    }
    .floating-whatsapp:hover { transform: scale(1.1); }

    .floating-quote-container {
      position: fixed; bottom: 40px; right: 40px; z-index: 2000;
      display: flex; align-items: center; flex-direction: row-reverse;
      cursor: pointer;
      text-decoration: none;
    }
    .floating-quote {
      width: 55px; height: 55px; 
      background: linear-gradient(135deg, #C9A84C 0%, #E8C97A 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(201, 168, 76, 0.3);
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .floating-quote svg { width: 28px; height: 28px; fill: #0D0D0D; }
    .quote-tooltip {
      position: absolute; right: 70px; background: #FFFFFF; color: #0D0D0D;
      padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700;
      white-space: nowrap; opacity: 0; transform: translateX(20px);
      pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .floating-quote-container:hover .quote-tooltip { opacity: 1; transform: translateX(0); }
    .floating-quote-container:hover .floating-quote { transform: scale(1.1) rotate(90deg); }

  </style>
</head>
