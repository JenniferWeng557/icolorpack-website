<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - iColorPack</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --black: #0D0D0D;
      --white: #FFFFFF;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      border: 1px solid rgba(201, 168, 76, 0.3);
      background: rgba(255, 255, 255, 0.05);
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 30px;
      display: block;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--gold);
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
      color: rgba(255, 255, 255, 0.8);
    }
    .btn-home {
      display: inline-block;
      padding: 15px 40px;
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .btn-home:hover {
      background: var(--white);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="logo">iColorPack</a>
    <h1>Thank You!</h1>
    <p>Your inquiry has been successfully received.<br>Jennifer will review your requirements and contact you via <strong>WhatsApp</strong> or <strong>Email</strong> within 24 business hours.</p>
    <a href="index.html" class="btn-home">Back to Home</a>
  </div>
</body>
</html>
