<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍南星野工艺礼品厂 - 马口铁吧唧定制专家</title>
    <style>
        :root {
            --primary-blue: #0A192F;
            --accent-gold: #C9A84C;
            --text-white: #FFFFFF;
            --bg-light: #F4F7F6;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
        }
        header {
            background-color: var(--primary-blue);
            color: var(--text-white);
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .nav a {
            color: var(--text-white);
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }
        .hero {
            background: linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)), url('https://sc02.alicdn.com/kf/A4b28e7ffdbe2427e9c6c6ad5e304a3ffI.png') center/cover;
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-white);
            text-align: center;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: var(--accent-gold);
        }
        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .cta-btn {
            background-color: var(--accent-gold);
            color: var(--primary-blue);
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 18px;
        }
        .section {
            padding: 60px 10%;
        }
        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
        }
        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background-color: var(--accent-gold);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .strength-img {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: block;
            border-radius: 10px;
        }
        footer {
            background-color: var(--primary-blue);
            color: #888;
            padding: 40px 10%;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">苍南星野工艺</div>
    <div class="nav">
        <a href="#">首页</a>
        <a href="#">产品中心</a>
        <a href="#">工厂实力</a>
        <a href="#">联系我们</a>
    </div>
</header>

<div class="hero">
    <h1>苍南星野工艺礼品厂</h1>
    <p>10年匠心专注 · 马口铁吧唧定制领跑者</p>
    <a href="#" class="cta-btn">立即咨询定做</a>
</div>

<div class="section">
    <div class="section-title">核心定制产品</div>
    <div class="grid">
        <div class="card">
            <img src="https://sc02.alicdn.com/kf/Af73859ab3929404f8d5c350e5d31d8c5L.png" alt="吧唧">
            <h3>58mm 圆形吧唧</h3>
            <p>高清胶印 · 一级马口铁</p>
        </div>
        <div class="card">
            <img src="https://sc02.alicdn.com/kf/Abfdc10a7db26421280340f3761f53c54j.png" alt="镭射吧唧">
            <h3>镭射/双闪吧唧</h3>
            <p>多种特效膜可选</p>
        </div>
        <div class="card">
            <img src="https://sc02.alicdn.com/kf/A3f8013695d0a4be8b35d17a65f5188dd9.png" alt="异形">
            <h3>异形定制</h3>
            <p>心形/方形/多边形</p>
        </div>
    </div>
</div>

<div class="section" style="background-color: #fff;">
    <div class="section-title">服务保障</div>
    <img src="https://sc02.alicdn.com/kf/A4779073942174959b2ea1cdff048513aG.png" class="strength-img" alt="服务保障">
</div>

<div class="section">
    <div class="section-title">工厂生产实力</div>
    <img src="https://sc02.alicdn.com/kf/A7ad469c88aa44f0da55d431e0a1f5384U.png" class="strength-img" alt="工厂实力">
</div>

<footer>
    <p>&copy; 2026 苍南星野工艺礼品厂 | 地址：浙江省温州市苍南县钱库镇工业区</p>
    <p>联系电话：180xxxxXXXX (示例) | 浙ICP备xxxxxxxx号</p>
</footer>

</body>
</html>
