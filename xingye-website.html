<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍南星野工艺礼品厂 - 马口铁吧唧定制专家</title>
    <style>
        :root {
            --primary-blue: #0A192F;
            --accent-gold: #C9A84C;
            --text-white: #FFFFFF;
            --bg-light: #F4F7F6;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
        }
        header {
            background-color: var(--primary-blue);
            color: var(--text-white);
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .nav a {
            color: var(--text-white);
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }
        .hero {
            background: linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)), url('https://sc02.alicdn.com/kf/A4b28e7ffdbe2427e9c6c6ad5e304a3ffI.png') center/cover;
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-white);
            text-align: center;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: var(--accent-gold);
        }
        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .cta-btn {
            background-color: var(--accent-gold);
            color: var(--primary-blue);
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 18px;
        }
        .section {
            padding: 60px 10%;
        }
        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
        }
        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background-color: var(--accent-gold);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .strength-img {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: block;
            border-radius: 10px;
        }
        footer {
            background-color: var(--primary-blue);
            color: #888;
            padding: 40px 10%;
            text-align: center;
        }
    
    /* WIDGETS */
    .floating-whatsapp {
      position: fixed; bottom: 40px; left: 40px; z-index: 2000;
      width: 55px; height: 55px; background: #25D366; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3); transition: 0.3s ease;
    }
    .floating-whatsapp:hover { transform: scale(1.1); }

    .floating-quote-container {
      position: fixed; bottom: 40px; right: 40px; z-index: 2000;
      display: flex; align-items: center; flex-direction: row-reverse;
      cursor: pointer;
      text-decoration: none;
    }
    .floating-quote {
      width: 55px; height: 55px; 
      background: linear-gradient(135deg, #C9A84C 0%, #E8C97A 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(201, 168, 76, 0.3);
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .floating-quote svg { width: 28px; height: 28px; fill: #0D0D0D; }
    .quote-tooltip {
      position: absolute; right: 70px; background: #FFFFFF; color: #0D0D0D;
      padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700;
      white-space: nowrap; opacity: 0; transform: translateX(20px);
      pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .floating-quote-container:hover .quote-tooltip { opacity: 1; transform: translateX(0); }
    .floating-quote-container:hover .floating-quote { transform: scale(1.1) rotate(90deg); }

  </style>
</head>
