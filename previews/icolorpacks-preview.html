,255,255,0.02); padding-top: 30px; }\n\n    /* MODAL */\n    .modal {\n      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);\n      z-index: 3000; align-items: center; justify-content: center; padding: 20px;\n      backdrop-filter: blur(10px);\n    }\n    .modal.active { display: flex; }\n    .modal-content {\n      background: #0d0d14; width: 100%; max-width: 850px; max-height: 90vh;\n      overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; \n      padding: 0; position: relative;\n    }\n    .modal-inner { padding: 40px 50px; }\n    .close-modal { position: absolute; top: 20px; right: 25px; color: var(--text-muted); font-size: 30px; cursor: pointer; z-index: 10; }\n    \n    .consultant-bar { \n      background: rgba(255,255,255,0.03); padding: 20px 50px; \n      display: flex; align-items: center; justify-content: space-between;\n      border-bottom: 1px solid var(--border);\n    }\n    .consultant-info-mini { display: flex; align-items: center; gap: 15px; }\n    .consultant-avatar-mini { \n      width: 50px; height: 50px; border-radius: 50%; \n      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);\n      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000;\n    }\n    .consultant-text h4 { font-size: 14px; color: var(--white); margin-bottom: 2px; }\n    .consultant-text p { font-size: 11px; color: var(--text-muted); }\n    .online-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #25D366; }\n    .status-dot { width: 8px; height: 8px; background: #25D366; border-radius: 50%; box-shadow: 0 0 10px #25D366; }\n\n    .inquiry-section-title { \n      font-size: 12px; color: var(--text-muted); text-transform: uppercase; \n      letter-spacing: 2px; margin: 30px 0 20px; display: flex; align-items: center; gap: 10px;\n    }\n    .inquiry-section-title span { color: var(--gold); }\n    \n    .luxo-form { display: grid; grid-template-c uct-body { padding: 18px 16px; }\n      .home-product-use { min-height: 0; }\n      .hero-content h1 { font-size: 38px; }\n      .nav-links { display: none; }\n      .luxo-form, .request-types { grid-template-columns: 1fr; }\n      .luxo-group.full, .btn-luxo-submit { grid-column: span 1; }\n      .consultant-bar { padding: 20px; }\n      .modal-inner { padding: 30px 20px; }\n    }\n    @media (max-width: 520px) {\n      .home-product-actions { grid-template-columns: 1.15fr .85fr; }\n    }\n\n    /* CASES GRID */\n    .cases-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; }\n    .case-card { background: #12121a; padding: 40px; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; transition: 0.3s; text-align: left; }\n    .case-card:hover { border-color: var(--gold); transform: translateY(-5px); }\n    .case-location { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 2px; display: block; margin-bottom: 15px; }\n    .case-card h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--white); margin-bottom: 25px; letter-spacing: 1px; }\n    .case-card ul { list-style: none; padding: 0; }\n    .case-card li { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }\n    .case-card li::before { content: '&bull;'; color: var(--gold); font-weight: bold; }\n  \n        /* Navigation Dropdowns */\n        .nav-links { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; align-items: center; }\n        .nav-links a { text-decoration: none; color: #8A8A9A; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }\n        .nav-links a:hover { color: #C9A84C; }\n        .nav-links li.dropdown { position: relative; }\n        .btn-quote-nav { \n            border: 1px solid #C9A84C; color: #C9A84C; padding: 8px 18px; \n            font-size: 10px; font-weight: 700; transition: /* Fix 2: Full Screen Navigation Menu */\n      .icp-mobile-nav-overlay {\n        position: fixed; top: 0; left: 0; width: 100%; height: 100%;\n        background: #000; z-index: 3000; display: none; flex-direction: column;\n        padding: 80px 40px; transition: 0.3s ease;\n      }\n      .icp-mobile-nav-overlay.active { display: flex; }\n      .icp-mobile-nav-close { position: absolute; top: 20px; right: 20px; color: #FFF; font-size: 30px; cursor: pointer; }\n      .icp-mobile-nav-links { list-style: none; display: flex; flex-direction: column; gap: 30px; }\n      .icp-mobile-nav-overlay { overflow-y: auto; }\n      .icp-mobile-nav-links a { color: #FFF; text-decoration: none; font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }\n      .icp-mobile-nav-links a:hover { color: #C9A84C; }\n\n      /* Expandable submenu (Products / Industries) */\n      .icp-sub-toggle {\n        background: none; border: none; padding: 0; cursor: pointer;\n        color: #FFF; font-size: 22px; font-weight: 600; text-transform: uppercase;\n        letter-spacing: 2px; font-family: inherit;\n        display: flex; align-items: center; gap: 10px; width: 100%;\n      }\n      .icp-arrow {\n        color: #C9A84C; font-size: 16px; line-height: 1;\n        transition: transform 0.25s ease;\n      }\n      .icp-has-sub.open .icp-arrow { transform: rotate(90deg); }\n      .icp-sub-menu {\n        list-style: none; margin: 0; padding: 0 0 0 18px;\n        max-height: 0; overflow: hidden; transition: max-height 0.3s ease;\n        border-left: 1px solid rgba(201,168,76,0.35);\n      }\n      .icp-has-sub.open .icp-sub-menu { max-height: 500px; margin-top: 18px; }\n      .icp-sub-menu li { margin: 0 0 16px 0; }\n      .icp-sub-menu li:last-child { margin-bottom: 4px; }\n      .icp-mobile-nav-links .icp-sub-menu a {\n        font-size: 16px; font-weight: 500; letter-spacing: 1px; color: #C9C9D4;\n      }\n      .icp-mobile-nav-links .icp-sub-menu a:hover { color: #C9A84C; }\n\n      /* Fix 3: Hero Section with Absolute Image */\n      .icp-mobile-hero { padding: 30px 16px; background: #000; }\n      .icp-mobile-hero-img-wrap { width: 100%; height: 200px; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }\n      .icp-mobile-hero-img-wrap img { width: 100%; height: 100%; object-fit: cover; }\n      .icp-mobile-hero-heading { font-size: 26px; font-weight: 700; line-height: 1.2; color: #FFF; margin-bottom: 15px; font-family: 'Playfair Display', serif; }\n      .icp-mobile-hero-text { font-size: 14px; color: #8A8A9A; line-height: 1.6; margin-bottom: 20px; }\n      .icp-mobile-primary-btn {\n        display: flex; width: 100%; background: #C9A84C; color: #000; padding: 16px; border-radius: 4px;\n        font-weight: 800; justify-content: center; text-decoration: none; font-size: 14px;\n      }\n\n      /* Fix 4: Company Intro / Story Layout */\n      #our-story { padding: 60px 20px !important; }\n      #our-story > div { grid-template-columns: 1fr !important; gap: 40px !important; }\n      #our-story img { height: 350px !important; }\n      #our-story .section-title { font-size: 28px !important; }\n      #our-story div[style*=\"bottom: -30px\"] { right: 10px !important; bottom: -20px !important; font-size: 14px !important; padding: 15px !important; }\n\n      /* Fix 5: Footer Spacing */\n      .icp-mobile-sticky-cta {\n        position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;\n        display: grid; grid-template-columns: 1fr 1fr; gap: 8px;\n        width: 100%; max-width: 100vw; box-sizing: border-box;\n        padding: 12px; background: rgba(13, 13, 20, 0.98); backdrop-filter: blur(10px);\n        border-top: 1px solid rgba(201,168,76,0.3);\n      }\n      .icp-mobile-sticky-cta a {\n        display: flex; align-items: center; justify-content: center; height: 48px;\n        min-width: 0; box-sizing: border-box; white-space: nowrap; overflow: hidden;\n        border-radius: 4px; font-size: 14px; font-weight: 800; text-decoration: none;\n      }\n      .icp-mobile-sticky-cta .is-secondary { border: 1px solid #333; color: #FFF; background: #16161d; }\n      .icp-mobile-sticky-cta .is-primary { background: #25D366; color: #FFF; border: none; }\n\n      /* Hide original desktop elements that clash */\n      #navbar, .category-banner, header.hero, section.hero { display: none !important; }\n    }\n\n    @media (min-width: 769px) {\n      .icp-mobile-header, .icp-mobile-hero, .icp-mobile-nav-overlay, .icp-mobile-sticky-cta { display: none !important; }\n    }\n\u003c/style>\n\u003cstyle>\n        .dropdown:hover .dropdown-content { display: block !important; }\n  /* STRETCH: FORCE HIDE MOBILE ELEMENTS ON DESKTOP */\n  @media (min-width: 769px) {\n    .icp-mobile-sticky-cta,\n    .icp-m-footer,\n    .floating-email,\n    .email-float,\n    .email-floating,\n    #icpFE,\n    a[href^=\"mailto:\"].floating-email,\n    a[href^=\"mailto:\"].email-float,\n    .icp-mobile-sticky-cta a[href^=\"mailto:\"],\n    .icp-m-footer a[href^=\"mailto:\"] {\n      display: none !important;\n    }\n  }\n\u003c/style>\n\u003cstyle>/* iColorPacks unified floating actions - VERIFIED FIX */\n.icp-floating-actions {\n  position: static;\n  pointer-events: none;\n}\n\n.icp-floating-actions a,\n.icp-floating-actions button {\n  pointer-events: auto;\n}\n\n.icp-float-whatsapp,\n.icp-float-plus {\n  position: fixed;\n  bottom: 40px;\n  z-index: 99999;\n  width: 60px;\n  height: 60px;\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border: none;\n  text-decoration: none;\n  cursor: pointer;\n  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);\n  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);\n}\n\n.icp-float-whatsapp:hover, .icp-float-plus:hover { transform: scale(1.1) translateY(-5px); }\n.icp-float-whatsapp:active, .icp-float-plus:active { transform: scale(0.9); }\n\n.icp-float-whatsapp {\n  background: #25d366;\n  right: 40px;\n}\n\n.icp-float- x solid rgba(255,255,255,.15)}.priority-faq summary{font-size:16px;font-weight:600;cursor:pointer}.priority-note{font-size:13px!important;color:#aaa9b5!important}\n.priority-section table{width:100%;border-collapse:collapse;margin:24px 0}.priority-section th,.priority-section td{padding:16px;text-align:left;vertical-align:top;border:1px solid rgba(255,255,255,.15);font-size:14px;line-height:1.65}\n.priority-section th{color:#e8c97a}.priority-section td{color:#c0bfca}.priority-table-scroll{overflow:auto}\n.priority-category-cta{padding:28px 8%;background:#12121a}.priority-category-cta p{max-width:850px;color:#c0bfca;line-height:1.8;margin:auto}.priority-category-cta .priority-actions{justify-content:center}\n.hero .priority-actions{justify-content:flex-start}.priority-home-note{font-size:14px!important;margin-top:20px!important;margin-bottom:0!important;color:#ddd!important}\n.specs-container{overflow-x:auto}.specs-container table{min-width:540px}\n.priority-hero-media{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:0;pointer-events:none}.priority-hero-media img{width:100%;height:100%;object-fit:cover;min-width:0}.hero:has(.priority-hero-media)::before{z-index:1}.hero:has(.priority-hero-media) .hero-content{z-index:2}\n.icp-mobile-hero-img-wrap.priority-mobile-images{display:grid;grid-template-columns:1fr 1fr;gap:8px}.priority-mobile-images img{height:200px!important;min-width:0}\n@media(max-width:700px){.priority-grid{grid-template-columns:1fr}.priority-section{padding:42px 20px}.priority-actions{gap:10px}.priority-actions a{flex:1 1 160px;padding:12px 15px}.priority-category-cta{padding:26px 20px}.priority-table-scroll table{min-width:540px}}\n\n.priority-order-terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:680px;margin:18px 0}.priority-order-terms div{padding:12px;border:1px solid rgba(201,168,76,.5);background:rgba(10,10,15,.8)}.priority-order-terms strong{display:block;color:#ead39a;font:700 19px/1.5 Inter,Arial,sans-serif}.priority-order-terms span{color:#d1cfda;font:12px/1.5 Inter,Arial,sans-serif}.priority-terms-note{font-size:12px!important;line-height:1.6!important;color:#d1cfda!important;margin:8px 0 16px!important;max-width:680px!important}.priority-category-cta .priority-order-terms{margin:0 auto 14px}.priority-category-cta .priority-terms-note{margin:8px auto 20px!important}\n@media(min-width:901px){.hero:has(.priority-hero-media){height:auto;min-height:100vh;padding-top:130px;padding-bottom:70px}.hero:has(.priority-hero-media) h1{font-size:clamp(36px,3.6vw,52px);line-height:1.18;margin-bottom:20px}.hero:has(.priority-hero-media) .hero-content>p{margin-bottom:20px}.hero:has(.priority-hero-media) .priority-home-note{margin-bottom:20px!important}}\n@media(max-width:700px){.priority-order-terms{gap:8px}.priority-order-terms div{padding:10px 8px}.priority-order-terms strong{font-size:17px}.priority-order-terms span{font-size:11px}.priority-category-cta .priority-actions a{flex-basis:100%}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n    \u003c!-- ICP MOBILE UI V2 -->\n    \u003cheader class=\"icp-mobile-header\">\n      \u003ca class=\"icp-mobile-logo-text\" href=\"/\">\n        \u003csvg class=\"icp-mobile-logo-img\" viewBox=\"0 0 40 40\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"iColorPacks\">\n          \u003crect width=\"40\" height=\"40\" rx=\"8\" fill=\"#C9A84C\"/>\n          \u003cpath d=\"M20 7L31 13.5V26.5L20 33L9 26.5V13.5L20 7Z\" fill=\"#0D0D14\"/>\n          \u003cpath d=\"M20 13L26 16.5V23.5L20 27L14 23.5V16.5L20 13Z\" fill=\"#C9A84C\"/>\n        \u003c/svg>\n        iColorPacks\n      \u003c/a>\n      \u003cdiv class=\"icp-mobile-header-actions\">\n        \u003ca class=\"icp-mobile-quote-btn\" href=\"https://wa.me/8618058355198\">QUOTE\u003c/a>\n        \u003cbutton class=\"icp-mobile-menu-btn\" onclick=\"toggleIcpMenu()\">\n          \u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cline x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\">\u003c/line>\u003cline x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\">\u003c/line>\u003cline x1=\"3\" y1=\"18\" x2=\"21\" y2=\"18\">\u003c/line>\u003c/svg>\n        \u003c/button>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv id=\"icpMobileNav\" class=\"icp-mobile-nav-overlay\">\n      \u003cspan class=\"icp-mobile-nav-close\" onclick=\"toggleIcpMenu()\">&times;\u003c/span>\n      \u003cul class=\"icp-mobile-nav-links\">\n        \u003cli>\u003ca href=\"/\" onclick=\"toggleIcpMenu()\">Home\u003c/a>\u003c/li>\n\n        \u003cli class=\"icp-has-sub\">\n          \u003cbutton type=\"button\" class=\"icp-sub-toggle\" onclick=\"toggleIcpSub(this)\">\n            Products \u003cspan class=\"icp-arrow\">&#9656;\u003c/span>\n          \u003c/button>\n          \u003cul class=\"icp-sub-menu\">\n            \u003cli>\u003ca href=\"/product-rigid-boxes\" onclick=\"toggleIcpMenu()\">Rigid Boxes\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/product-paper-bags\" onclick=\"toggleIcpMenu()\">Paper Bags\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/product-cake-boxes\" onclick=\"toggleIcpMenu()\">Cake Boxes\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/product-mailer-boxes\" onclick=\"toggleIcpMenu()\">Mailer Boxes\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/product-kraft-bags\" onclick=\"toggleIcpMenu()\">Kraft Bags\u003c/a>\u003c/li>\n          \u003c/ul>\n        \u003c/li>\n\n        \u003cli class=\"icp-has-sub\">\n          \u003cbutton type=\"button\" class=\"icp-sub-toggle\" onclick=\"toggleIcpSub(this)\">\n            Industries \u003cspan class=\"icp-arrow\">&#9656;\u003c/span>\n          \u003c/button>\n          \u003cul class=\"icp-sub-menu\">\n            \u003cli>\u003ca href=\"/packaging-for-cosmetics-brands\" onclick=\"toggleIcpMenu()\">Cosmetics\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-jewelry-brands\" onclick=\"toggleIcpMenu()\">Jewelry\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-bakeries\" onclick=\"toggleIcpMenu()\">Bakery\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-clothing-boutiques\" onclick=\"toggleIcpMenu()\">Clothing\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-candle-brands\" onclick=\"toggleIcpMenu()\">Candle\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-perfume-brands\" onclick=\"toggleIcpMenu()\">Perfume\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-ecommerce-brands\" onclick=\"toggleIcpMenu()\">E-commerce\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/packaging-for-gift-shops\" onclick=\"toggleIcpMenu()\">Gift Shop\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"/industry-cases-2026\" onclick=\"toggleIcpMenu()\">View All &rarr;\u003c/a>\u003c/li>\n          \u003c/ul>\n        \u003c/li>\n\n        \u003cli>\u003ca href=\"/#factory\" onclick=\"toggleIcpMenu()\">Factory\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"/blog\" onclick=\"toggleIcpMenu()\">Blog\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"/faq\" onclick=\"toggleIcpMenu()\">FAQ\u003c/a>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    \u003csection class=\"icp-mobile-hero\">\n      \u003cdiv class=\"icp-mobile-hero-img-wrap priority-mobile-images\">\n        \u003cimg src=\"https://www.icolorpacks.com/images/product-pages/paper-bags/white-gold-ribbon-bag-v1.webp\" alt=\"Paper bag design reference with ribbon handles\">\u003cimg src=\"https://www.icolorpacks.com/images/cake-grand-vision-window-v2.webp\" alt=\"Window cake box design reference\">\n      \u003c/div>\n      \u003cp style=\"color:#C9A84C; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:2px; margin-bottom:5px;\">Premium B2B Packaging\u003c/p>\n      \u003cp class=\"icp-mobile-hero-heading\">Custom Paper Bags &amp ba(255,255,255,0.05);\">\n    \u003cspan class=\"section-label\">Pricing Guide\u003c/span>\n    \u003ch2 class=\"section-title\">Transparent \u003cem>Pricing Structure.\u003c/em>\u003c/h2>\n    \u003cp style=\"max-width: 800px; margin: 0 auto 50px; color: #BBB; line-height: 1.8;\">\n      At iColorPacks, we believe in honest, direct-factory pricing. Your final cost is determined by material choice, structure complexity, surface finishes, and order volume. Review our \u003ca href=\"/custom-packaging-cost-guide-china\" style=\"color:var(--gold);\">custom packaging cost guide\u003c/a> before preparing your RFQ.\n    \u003c/p>\n    \n    \u003cdiv class=\"stats-grid\" style=\"grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-bottom: 60px;\">\n      \u003cdiv class=\"stat-item\" style=\"padding: 30px; border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; background: rgba(255,255,255,0.02);\">\n        \u003ch3 style=\"color: var(--gold); margin-bottom: 10px; font-size: 20px;\">01. Materials\u003c/h3>\n        \u003cp style=\"font-size: 14px; color: #888;\">Rigid board, Kraft, or Ivory board options.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"stat-item\" style=\"padding: 30px; border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; background: rgba(255,255,255,0.02);\">\n        \u003ch3 style=\"color: var(--gold); margin-bottom: 10px; font-size: 20px;\">02. Finishes\u003c/h3>\n        \u003cp style=\"font-size: 14px; color: #888;\">Foil stamping, Embossing, UV or Soft Touch.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"stat-item\" style=\"padding: 30px; border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; background: rgba(255,255,255,0.02);\">\n        \u003ch3 style=\"color: var(--gold); margin-bottom: 10px; font-size: 20px;\">03. Volume\u003c/h3>\n        \u003cp style=\"font-size: 14px; color: #888;\">Unit prices drop significantly as quantity increases.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"stat-item\" style=\"padding: 30px; border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; background: rgba(255,255,255,0.02);\">\n        \u003ch3 style=\"color: var(--gold); margin-bottom: 10px; font-size: 20px;\">04. Shipping\u003c/h3>\n        \u003cp style=\"font-size: 14px; color: #888;\">Freight options are reviewed by destination, timing and trade term.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \n    \u003cdiv style=\"background: rgba(201,168,76,0.05); padding: 40px; border-radius: 16px; border: 1px dashed var(--gold); display: inline-block; max-width: 600px;\">\n      \u003cp style=\"font-size: 15px; color: #DDD;\">\n        \u003cstrong style=\"color: var(--gold);\">Buyer tip:\u003c/strong> Compare quotations using the same size, material, insert, print, finish, packing method and delivery term. A lower unit price may reflect a different specification.\n      \u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- OUR MISSION & BRAND STORY -->\n  \u003csection id=\"our-story\" style=\"padding: 120px 10%; background: #0A0A0A; border-top: 1px solid rgba(255,255,255,0.05);\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; align-items: center;\">\n      \u003cdiv style=\"position: relative;\">\n        \u003cdiv style=\"width: 100%; height: 500px; background: #111; border: 1px solid var(--gold); border-radius: 12px; overflow: hidden;\">\n          \u003cimg src=\"https://www.icolorpacks.com/images/home-manufacturing-facility-v2.webp\" loading=\"lazy\" decoding=\"async\" alt=\"iColorPacks Manufacturing Facility\" style=\"width: 100%; height: 100%; object-fit: cover; opacity: 0.9;\">\n        \u003c/div>\n        \u003cdiv style=\"position: absolute; bottom: -30px; right: -30px; background: var(--gold); color: #000; padding: 20px 30px; border-radius: 8px; font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5) n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- FAQ -->\n  \n    \u003csection id=\"faq\" class=\"faq\">\n    \u003cdiv class=\"faq-container\">\n      \u003cspan class=\"section-label\" style=\"text-align: center;\">Packaging Intelligence\u003c/span>\n      \u003ch2 class=\"section-title\" style=\"font-size: 42px; margin-bottom: 60px;\">Common \u003cem>Questions.\u003c/em>\u003c/h2>\n      \n      \u003cdiv class=\"faq-item\">\n        \u003cdetails>\n          \u003csummary>What is your Minimum Order Quantity (MOQ)?\u003c/summary>\n          \u003cdiv class=\"faq-content\">The minimum order for paper bags and cake boxes is 500 pieces. Send the quantity and requirements for each design so we can review your project.\u003c/div>\n        \u003c/details>\n      \u003c/div>\n      \u003cdiv class=\"faq-item\">\n        \u003cdetails>\n          \u003csummary>Where is the iColorPacks luxury packaging factory located?\u003c/summary>\n          \u003cdiv class=\"faq-content\">Our team is based in Wenzhou, Zhejiang, China. If you need company or production verification for a sourcing review, include that request with your inquiry.\u003c/div>\n        \u003c/details>\n      \u003c/div>\n      \u003cdiv class=\"faq-item\">\n        \u003cdetails>\n          \u003csummary>What information is needed for a useful quote?\u003c/summary>\n          \u003cdiv class=\"faq-content\">Please provide the product or internal dimensions, packed weight, quantity by design, preferred structure and material, artwork status, finishes, insert needs, destination and target arrival date.\u003c/div>\n        \u003c/details>\n      \u003c/div>\n      \u003cdiv class=\"faq-item\">\n        \u003cdetails>\n          \u003csummary>How are sampling, production and delivery times confirmed?\u003c/summary>\n          \u003cdiv class=\"faq-content\">Paper bag and cake box sampling normally takes 3–5 days. Production normally takes 10–15 days after sample approva 5198\" class=\"btn-quote-nav\">Inquiry\u003c/a>\n    \u003c/nav>\n\n    \u003csection class=\"hero\">\n        \u003ch1>Custom Luxury \u003cem>Paper Bags with Logo\u003c/em>\u003c/h1>\n    \u003c/section>\n\u003csection class=\"priority-category-cta\">\u003cdiv class=\"priority-order-terms\" aria-label=\"Ordering conditions\">\u003cdiv>\u003cstrong>500 pcs\u003c/strong>\u003cspan>Minimum order\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>3–5 days\u003c/strong>\u003cspan>Sampling\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>10–15 days\u003c/strong>\u003cspan>Production\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"priority-terms-note\">Production follows sample approval. Delivery time is quoted separately for your destination.\u003c/p>\u003cp>Start with a product photo, estimated quantity and delivery country. If you know the size and finish, include them; we can help you work through the remaining details.\u003c/p>\u003cdiv class=\"priority-actions\">\u003ca href=\"https://wa.me/8618058355198\" data-product-label=\"Paper Bags\">Ask About Paper Bags on WhatsApp\u003c/a>\u003ca href=\"#buying-guide\">Compare Options\u003c/a>\u003c/div>\u003c/section>\n    \u003csection class=\"intro-section\">\n        \u003ch2>Printed Shopping Bags for Retail, Boutiques and Gifting\u003c/h2>\n        \u003cp>Choose your bag around what it needs to carry: product dimensions, packed weight and the impression you want to create. Compare paper, handles, printing and reinforcement for your retail or gifting project.\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n        \u003ch2 style=\"text-align: center; font-family: 'Playfair Display'; font-size: 36px; margin-bottom: 60px;\">Premium Custom Styles\u003c/h2>\n        \u003cdiv class=\"styles-grid\">\n            \u003ca class=\"style-card\" href=\"/custom-grosgrain-ribbon-paper-bags\" aria-label=\"View custom grosgrain ribbon handle paper bags\">\n                \u003cimg src=\"https://www.icolorpacks.com/images/product-pages/paper-bags/white-gold-ribbon-bag-v1.webp\" class=\"style-img\" alt=\"White luxury paper bag with champagne gold grosgrain ribbon handles\">\n                \u003cdiv class=\"style-info\">\n                    \u003ch4>Grosgrain Ribbon Handles\u003c/h4>\n                    \u003cp>High-end 250gsm art paper with silk ribbon for a superior retail experience.\u003c/p>\n                \u003c/div>\n            \u003c/a>\n            \u003ca class=\"style-card\" href=\"/custom-matte-laminated-paper-bags\" aria-label=\"View custom matte laminated paper bags\">\n                \u003cimg src=\"https://www.icolorpacks.com/images/Af61649da05f94b1496aeb138fbe23dfcV.webp\" class=\"style-img\" alt=\"Matte Luxury Bag\">\n                \u003cdiv class=\"style-info\">\n                    \u003ch4>Matte Finish Elite Bags\u003c/h4>\n                    \u003cp>Scratch-resistant matte lamination with reinforced base for premium brands.\u003c/p>\n                \u003c/div>\n            \u003c/a>\n            \u003ca class=\"style-card\" href=\"/custom-metallic-logo-paper-bags\" aria-label=\"View custom metallic logo paper bags\">\n                \u003cimg src=\"https://www.icolorpacks.com/images/A0e494056f8b04efda7a9a29ceb409bb1n.webp\" class=\"style-img\" alt=\"Metallic Logo Bag\">\n                \u003cdiv class=\"style-info\">\n                    \u003ch4>Metallic Logo Bags\u003c/h4>\n                    \u003cp>Gold and silver foil stamping that catches the light and commands attention.\u003c/p>\n                \u003c/div>\n            \u003c/a>\n        \u003c/div>\n    \u003c/section>\n\n\u003csection class=\"priority-section\" id=\"buying-guide\">\u003cdiv class=\"priority-inner\">\u003ch2>Choose Your Paper Bag Construction\u003c/h2>\u003cdiv class=\"priority-grid\">\u003carticle class=\"priority-card\">\u003ch3>Ribbon handles and presentation\u003c/h3>\u003cp>For boutique purchases and gift sets, compare ribbon or cotton handles, paper texture and top fr); gap: 40px; max-width: 1200px; margin: 0 auto;\">\n      \u003cdiv style=\"text-align: center;\">\n        \u003cdiv style=\"font-size: 40px; color: var(--gold); margin-bottom: 20px;\">\u003csvg viewBox=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1.6\" style=\"display:inline-block;\">\u003cpath d=\"M12 6V3m-3 3V4m6 2V4\"/>\u003cpath d=\"M5 10c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v2H5v-2z\"/>\u003cpath d=\"M4 12h16v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-7z\"/>\u003cpath d=\"M4 15c1.5 0 1.5 1.5 3 1.5s1.5-1.5 3-1.5 1.5 1.5 3 1.5 1.5-1.5 3-1.5\"/>\u003c/svg>\u003c/div>\n        \u003ch4 style=\"margin-bottom: 15px; letter-spacing: 1px;\">Food Grade Safety\u003c/h4>\n        \u003cp style=\"font-size: 13px; color: var(--text-muted);\">Materials, coatings and supporting documents are reviewed for the product, use case and destination-market requirements.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"text-align: center;\">\n        \u003cdiv style=\"font-size: 40px; color: var(--gold); margin-bottom: 20px;\">\u003csvg viewBox=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1.6\" style=\"display:inline-block;\">\u003cpath d=\"M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z\"/>\u003cpath d=\"M9 12l2 2 4-4\"/>\u003c/svg>\u003c/div>\n        \u003ch4 style=\"margin-bottom: 15px; letter-spacing: 1px;\">Structural Strength\u003c/h4>\n        \u003cp style=\"font-size: 13px; color: var(--text-muted);\">Engineered to stack without crushing, perfect for delivery-heavy bakery businesses.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"text-align: center;\">\n        \u003cdiv style=\"font-size: 40px; color: var(--gold); margin-bottom: 20px;\">\u003csvg viewBox=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1.6\" style=\"display:inline-block;\">\u003cpath d=\"M3 7l9-4 9 4v10l-9 4-9-4V7z\"/>\u003cpath d=\"M3 7l9 4 9-4M12 11v10\"/>\u003c/svg>\u003c/div>\n        \u003ch4 style=\"margin-bottom: 15px; letter-spacing: 1px;\">Easy Assembly\u003c/h4>\n        \u003cp style=\"font-size: 13px; color: var(--text-muted);\">Auto-locking bottoms and intuitive folds reduce labor time for busy staff.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003csection class=\"priority-section\" id=\"buying-guide\">\u003cdiv class=\"priority-inner\">\u003ch2>Choose a Cake Box That Fits Your Product\u003c/h2>\u003cdiv class=\"priority-grid\">\u003carticle class=\"priority-card\">\u003ch3>Window cake boxes\u003c/h3>\u003cp>Start with cake-board width and depth, cake height and decoration clearance. Confirm the window area, board and closing method with a loaded sample.\u003c/p>\u003ca href=\"/custom-window-cake-boxes\">View Window Cake Boxes\u003c/a>\u003c/article>\u003carticle class=\"priority-card\">\u003ch3>Carry-handle pastry boxes\u003c/h3>\u003cp>For takeaway pastries and small cakes, review the handle, product weight, dividers and assembly steps. Tell us how staff pack and carry the finished box.\u003c/p>\u003ca href=\"/custom-carry-handle-cake-boxes\">View Carry-Handle Boxes\u003c/a>\u003c/article>\u003carticle class=\"priority-card\">\u003ch3>Tall and tiered cake boxes\u003c/h3>\u003cp>Give cake-board dimensions, maximum finished height and total weight. Review base support, locking corners and the actual delivery method before approval.\u003c/p>\u003ca href=\"/custom-tiered-wedding-cake-boxes\">View Tall Cake Boxes\u003c/a>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"priority-section\">\u003cdiv class=\"priority-inner\">\u003ch2>Cake Box Ordering Questions\u003c/h2>\u003cdiv class=\"priority-faq\">\u003cdetails>\u003csummary>Which dimensions should I send?\u003c/summary>\u003cp>Send cake-board width and depth, finished cake height including decoration, packed weight and required usable interior dimensions. Include a photo when decorations extend beyond the cake board.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I add my bakery logo?\u003c/summary>\u003cp>Send your logo file or a reference and indicate colors and print areas. We will review the artwork, board, window placement and finish together before confirming the print route.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Do cake boxes ship flat?\u003c/summary>\u003cp>Many folding formats can ship flat, but the packing method depends on the structure. Ask for units per carton, carton dimensions and gross weight to compare freight and assembly requirements.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What are the MOQ and production time?\u003c/summary>\u003cp>Our minimum order is 500 pieces. Sampling normally takes 3–5 days; production normally takes 10–15 days after sample approval. Freight time is additional and is quoted for your destination.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How do I confirm suitability for food packaging?\u003c/summary>\u003cp>State whether the box directly contacts food, the expected moisture and temperature conditions, and the destination market. Confirm the specific board, coating and window materials with relevant supplier documentation.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"priority-section\">\u003cdiv class=\"priority-inner\">\u003ch2>Request Your Cake Box Quote\u003c/h2>\u003cp>Send a cake or packaging photo, estimated quantity and delivery country. Add cake-board dimensions and finished height if available.\u003c/p>\u003cdiv class=\"priority-actions\">\u003ca href=\"https://wa.me/8618058355198\" data-product-label=\"Cake Boxes\">Discuss Cake Boxes on WhatsApp\u003c/a>\u003ca href=\"/packaging-for-bakeries\">Explore Bakery Packaging\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n  \u003cfooter>\n        \u003cdiv class=\"footer-grid\">\n            \u003cdiv class=\"footer-col\" style=\"text-align: left;\">\n                \u003ca href=\"/\" class=\"logo\">iColorPacks 00 pcs\u003c/strong>\u003cspan>Minimum order\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>3–5 days\u003c/strong>\u003cspan>Sampling\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>10–15 days\u003c/strong>\u003cspan>Production\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"priority-terms-note\">Production follows sample approval. Delivery time is quoted separately for your destination.\u003c/p>\u003cp>Start with a product photo, estimated quantity and delivery country. If you know the size and finish, include them; we can help you work through the remaining details.\u003c/p>\u003cdiv class=\"priority-actions\">\u003ca href=\"https://wa.me/8618058355198\" data-product-label=\"Kraft Paper Bags\">Ask About Kraft Paper Bags on WhatsApp\u003c/a>\u003ca href=\"#buying-guide\">Compare Options\u003c/a>\u003c/div>\u003c/section>\n  \u003csection class=\"catalog-section\">\n    \u003cdiv class=\"section-header\">\n      \u003ch2>Custom Kraft Paper Bags for Retail and Takeaway\u003c/h2>\n      \u003cp>Custom brown and white kraft paper bags with handle, print and reinforcement options for retail, takeaway and e-commerce.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"product-grid\">\n      \u003cdiv class=\"product-card\">\n        \u003cdiv class=\"product-badge\">Natural\u003c/div>\n        \u003ca class=\"product-image-link\" href=\"/custom-bakery-kraft-paper-bags\" aria-label=\"View custom bakery kraft paper bags\">\u003cdiv class=\"product-image\">\u003cimg src=\"https://www.icolorpacks.com/images/product-pages/kraft-bags/bakery-kraft-bag-v2.webp\" alt=\"Natural kraft paper bag used at an artisan bakery counter\">\u003c/div>\u003c/a>\n        \u003cdiv class=\"product-info\">\n          \u003ch3>Bakery &amp; Deli Kraft Bag\u003c/h3>\n          \u003cdiv class=\"product-specs\">\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Material\u003c/span>\u003cspan class=\"spec-value\">Brown Kraft · GSM selected by load\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Handle\u003c/span>\u003cspan class=\"spec-value\">Reinforced Twisted Paper\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Process\u003c/span>\u003cspan class=\"spec-value\">Natural Finish + Custom Print\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">MOQ\u003c/span>\u003cspan class=\"spec-value\">500 pcs\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003ca href=\"https://wa.me/8618058355198?text=Hello%20iColorPacks,%20I%20just%20viewed%20your%20premium%20packaging%20collection%20and%20would%20like%20to%20discuss%20a%20custom%20project.%20Can%20we%20chat?\" class=\"btn-card-inquiry\">Inquire Now \u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"product-card\">\n        \u003cdiv class=\"product-badge\">Minimalist\u003c/div>\n        \u003ca class=\"product-image-link\" href=\"/custom-cafe-flat-handle-paper-bags\" aria-label=\"View custom cafe flat handle paper bags\">\u003cdiv class=\"product-image\">\u003cimg src=\"https://www.icolorpacks.com/images/product-pages/kraft-bags/cafe-yellow-takeaway-set-v1.webp\" alt=\"Yellow flat-handle cafe takeaway bags with coffee and food packaging\">\u003c/div>\u003c/a>\n        \u003cdiv class=\"product-info\">\n          \u003ch3>Café Flat-Handle Takeaway\u003c/h3>\n          \u003cdiv class=\"product-specs\">\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Material\u003c/span>\u003cspan class=\"spec-value\">White Kraft · GSM selected by load\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Handle\u003c/span>\u003cspan class=\"spec-value\">Internal Flat Paper Handle\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Process\u003c/span>\u003cspan class=\"spec-value\">Clean White + Minimalist Print\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">MOQ\u003c/span>\u003cspan class=\"spec-value\">500 pcs\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003ca href=\"https://wa.me/8618058355198?text=Hello%20iColorPacks,%20I%20just%20viewed%20your%20premium%20packaging%20collection%20and%20would%20like%20to%20discuss%20a%20custom%20project.%20Can%20we%20chat?\" class=\"btn-card-inquiry\">Inquire Now \u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"product-card\">\n        \u003cdiv class=\"product-badge\">Durable\u003c/div>\n        \u003ca class=\"product-image-link\" href=\"/custom-heavy-duty-kraft-shopping-bags\" aria-label=\"View custom heavy duty kraft shopping bags\">\u003cdiv class=\"product-image\">\u003cimg src=\"https://www.icolorpacks.com/images/product-pages/kraft-bags/heavy-duty-shopping-bag-v2.webp\" alt=\"Heavy-duty kraft shopping bag carrying boxed home goods\">\u003c/div>\u003c/a>\n        \u003cdiv class=\"product-info\">\n          \u003ch3>Heavy-Duty Retail Kraft\u003c/h3>\n          \u003cdiv class=\"product-specs\">\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Material\u003c/span>\u003cspan class=\"spec-value\">Reinforced Kraft · Project specific\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Handle\u003c/span>\u003cspan class=\"spec-value\">Double-Folded Paper Handle\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">Process\u003c/span>\u003cspan class=\"spec-value\">Reinforcement reviewed by load\u003c/span>\u003c/div>\n            \u003cdiv class=\"spec-row\">\u003cspan class=\"spec-label\">MOQ\u003c/span>\u003cspan class=\"spec-value\">500 pcs\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003ca href=\"https://wa.me/8618058355198?text=Hello%20iColorPacks,%20I%20just%20viewed%20your%20premium%20packaging%20collection%20and%20would%20like%20to%20discuss%20a%20custom%20project.%20Can%20we%20chat?\" class=\"btn-card-inquiry\">Inquire Now \u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003cmain class=\"kraft-guide\">\n    \u003csection class=\"kraft-section\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Kraft Paper Bag Buying Guide\u003c/p>\n        \u003ch2 class=\"kraft-title\" id=\"buying-guide\">Choose the structure before choosing the artwork\u003c/h2>\n        \u003cp class=\"kraft-lead\">A reliable kraft paper bag specification starts with the packed product, finished size, expected carrying weight and route to market. Paper weight alone does not determine strength: handle attachment, top fold, base board, adhesive, grain direction and carton packing all affect performance. Use the guidance below to prepare a clearer RFQ and compare quotations on the same basis.\u003c/p>\n        \u003cdiv class=\"kraft-grid\">\n          \u003carticle class=\"kraft-card\">\u003ch3>Retail &amp; boutique\u003c/h3>\u003cp>Prioritize clean color reproduction, comfortable handles and a size that presents apparel, accessories or boxed products without excess movement.\u003c/p>\u003cul>\u003cli>Twisted paper, flat paper or cotton handles\u003c/li>\u003cli>Reinforced top fold and base as required\u003c/li>\u003cli>Inside printing or tissue-paper coordination\u003c/li>\u003c/ul>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>Food takeaway\u003c/h3>\u003cp>Confirm the food container dimensions, packed weight, ventilation needs and whether the bag may contact grease, condensation or chilled products.\u003c/p>\u003cul>\u003cli>Wide base for stable container placement\u003c/li>\u003cli>Handle and adhesive reviewed for load\u003c/li>\u003cli>Barrier treatments assessed for end-of-life impact\u003c/li>\u003c/ul>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>E-commerce &amp; events\u003c/h3>\u003cp>Consider flat-pack efficiency, rapid packing, carton quantity and how the bag will look after storage, transport and repeated handling.\u003c/p>\u003cul>\u003cli>Machine-made formats for repeatability\u003c/li>\u003cli>Compact master-carton planning\u003c/li>\u003cli>QR, campaign or seasonal print options\u003c/li>\u003c/ul>\u003c/article>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Specification Data\u003c/p>\n        \u003ch2 class=\"kraft-title\">Paper, handle and reinforcement selection\u003c/h2>\n        \u003cp class=\"kraft-lead\">The ranges below are common starting points for discussion, not guaranteed load ratings. Final material and construction should be confirmed through a finished sample and an agreed carrying test using the actual packed product.\u003c/p>\n        \u003cdiv class=\"kraft-table-wrap\">\n          \u003ctable class=\"kraft-table\">\n            \u003cthead>\u003ctr>\u003cth>Application\u003c/th>\u003cth>Typical paper range\u003c/th>\u003cth>Common handle\u003c/th>\u003cth>Specification to review\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>Light retail items\u003c/td>\u003ctd>About 80–110 gsm kraft\u003c/td>\u003ctd>Flat or twisted paper\u003c/td>\u003ctd>Bag dimensions, handle patch, fold depth and packed weight\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Boutique apparel &amp; gifts\u003c/td>\u003ctd>About 110–150 gsm kraft\u003c/td>\u003ctd>Twisted paper, cotton or ribbon\u003c/td>\u003ctd>Top reinforcement, base board, print coverage and presentation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Food containers\u003c/td>\u003ctd>About 80–130 gsm kraft\u003c/td>\u003ctd>Flat or twisted paper\u003c/td>\u003ctd>Base width, container stability, moisture/grease exposure and ventilation\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>Heavier boxed products\u003c/td>\u003ctd>Project-specific heavier kraft or board\u003c/td>\u003ctd>Reinforced paper or textile handle\u003c/td>\u003ctd>Actual load test, handle anchoring, base reinforcement and carton protection\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cp class=\"kraft-note\">“GSM” describes paper mass per square metre; it is not a standalone strength guarantee. Recycled-fibre content, fibre direction, humidity, bag proportions and converting quality can change the result.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Printing &amp; Finishing\u003c/p>\n        \u003ch2 class=\"kraft-title\">Build the brand effect around the paper surface\u003c/h2>\n        \u003cdiv class=\"kraft-grid\">\n          \u003carticle class=\"kraft-card\">\u003ch3>Flexographic printing\u003c/h3>\u003cp>Often considered for simpler artwork and larger repeat runs. Confirm spot colors, ink coverage, registration tolerance and how the natural brown substrate changes the perceived color.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>Offset or high-detail print\u003c/h3>\u003cp>Useful when the design requires finer detail or broader color control. White kraft or a printed white underlayer may be evaluated when brand colors must appear brighter.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>Foil, embossing &amp; varnish\u003c/h3>\u003cp>Premium accents can be combined with kraft paper, but each added film, foil, laminate or barrier may affect cost, lead time and recyclability. Specify the finish area and desired effect.\u003c/p>\u003c/article>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Sustainability Review\u003c/p>\n        \u003ch2 class=\"kraft-title\">“Kraft” does not automatically mean the whole bag is recyclable\u003c/h2>\n        \u003cp class=\"kraft-lead\">A paper bag's end-of-life pathway depends on the complete construction and local collection system. Ask for the paper source, recycled-fibre content where relevant, handle material, adhesives, inks, coatings, laminations and reinforcements. A simpler mono-material paper construction can make separation easier, while plastic lamination, windows, non-paper handles or heavy barrier coatings may require different disposal guidance.\u003c/p>\n        \u003cdiv class=\"kraft-grid\">\n          \u003carticle class=\"kraft-card\">\u003ch3>Paper source\u003c/h3>\u003cp>State whether you need virgin fibre, recycled content or certified sourcing, and request documentation for any certification claim required by your market.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>Material compatibility\u003c/h3>\u003cp>Review handles, patches, base boards, windows and coatings together rather than evaluating only the outer paper.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-card\">\u003ch3>Right-size the bag\u003c/h3>\u003cp>A correctly sized bag can reduce unnecessary paper, improve carrying stability and lower packed carton volume.\u003c/p>\u003c/article>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Custom Manufacturing Process\u003c/p>\n        \u003ch2 class=\"kraft-title\">From product dimensions to production approval\u003c/h2>\n        \u003cdiv class=\"kraft-steps\">\n          \u003carticle class=\"kraft-step\">\u003ch3>Define the use\u003c/h3>\u003cp>Share product dimensions, packed weight, quantity, destination and whether the bag is for retail, takeaway, events or e-commerce.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-step\">\u003ch3>Confirm structure\u003c/h3>\u003cp>Select the finished size, paper type, handle, top fold, base reinforcement and packing method.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-step\">\u003ch3>Approve artwork &amp; sample\u003c/h3>\u003cp>Review dieline, colors, print coverage and finishes, then approve the agreed sample route before bulk production.\u003c/p>\u003c/article>\n          \u003carticle class=\"kraft-step\">\u003ch3>Inspect &amp; pack\u003c/h3>\u003cp>Confirm workmanship, dimensions, print, handle attachment and packing against the approved specification.\u003c/p>\u003c/article>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section\" id=\"kraft-faq\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Buyer FAQ\u003c/p>\n        \u003ch2 class=\"kraft-title\">Custom kraft paper bag questions\u003c/h2>\n        \u003cdiv class=\"kraft-faq\">\n          \u003cdetails>\u003csummary>What information is needed for a kraft paper bag quote?\u003c/summary>\u003cp>Send the finished width, height and gusset, expected packed weight, order quantity, paper preference, handle type, print artwork, finish requirements, delivery destination and target date. A reference photo is helpful, but dimensions and load requirements are still needed.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>What paper weight should I choose?\u003c/summary>\u003cp>Paper weight should be selected together with bag size, product weight, handle construction and reinforcement. Common projects may begin around 80–150 gsm, while large or heavy formats require project-specific review and testing.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>Are brown kraft and white kraft printed the same way?\u003c/summary>\u003cp>No. Natural brown kraft influences ink color and usually creates a muted, organic appearance. White kraft provides a brighter base for cleaner brand colors. Printed samples or agreed color standards help set expectations.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>Which handle is best for a custom kraft bag?\u003c/summary>\u003cp>Flat paper handles suit practical takeaway and retail formats; twisted paper handles give a more structured presentation; cotton or ribbon handles can support a premium look. The final choice depends on weight, comfort, appearance, recycling goals and budget.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>Can kraft paper bags be used for food takeaway?\u003c/summary>\u003cp>They can be designed around takeaway containers, but the specification must account for container size, heat, grease, condensation, ventilation and local food-contact requirements. The paper bag should not be treated as direct food-contact packaging unless specified and documented for that use.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>Are custom kraft paper bags recyclable?\u003c/summary>\u003cp>Many paper-based constructions may be recyclable where suitable collection and processing exist, but the complete bag matters. Laminations, barrier coatings, windows, textile handles and other components can change the appropriate disposal route.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>Can I approve a sample before bulk production?\u003c/summary>\u003cp>Yes. Depending on what must be checked, the sample route may include a structural blank, digital mockup, printed prototype or production-reference sample. Confirm what the sample represents before approval.\u003c/p>\u003c/details>\n          \u003cdetails>\u003csummary>How are MOQ and lead time confirmed?\u003c/summary>\u003cp>Our minimum order is 500 pieces. Sampling normally takes 3–5 days and production normally takes 10–15 days after sample approval. Confirm the final schedule and separate freight time with your quotation.\u003c/p>\u003c/details>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kraft-section kraft-cta\">\n      \u003cdiv class=\"kraft-wrap\">\n        \u003cp class=\"kraft-kicker\">Prepare a Comparable RFQ\u003c/p>\n        \u003ch2 class=\"kraft-title\">Request a specification-based kraft bag quote\u003c/h2>\n        \u003cp class=\"kraft-lead\">Send your size, packed weight, quantity, artwork, handle preference and delivery destination. We will review the construction and identify the remaining decisions before quotation.\u003c/p>\n        \u003ca href=\"https://wa.me/8618058355198?text=Hello%20iColorPacks%2C%20I%20would%20like%20a%20quote%20for%20custom%20kraft%20paper%20bags.%20I%20can%20share%20size%2C%20quantity%2C%20artwork%20and%20destination.\" data-product-type=\"kraft_paper_bags\" data-source-code=\"KB01\" data-cta-location=\"kraft_guide\">Discuss My Kraft Bag Project\u003c/a>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n    \n\u003csection class=\"priority-section\">\u003cdiv class=\"priority-inner\">\u003ch2>Compare Flat and Twisted Paper Handles\u003c/h2>\u003cdiv class=\"priority-grid\">\u003carticle class=\"priority-card\">\u003ch3>Flat handles for takeaway\u003c/h3>\u003cp>Provide container dimensions and packed weight. Review the base width and attachment areas, then check the finished bag under the intended load.\u003c/p>\u003ca href=\"/custom-cafe-flat-handle-paper-bags\">View Flat-Handle Bags\u003c/a>\u003c/article>\u003carticle class=\"priority-card\">\u003ch3>Twisted handles for retail\u003c/h3>\u003cp>Compare brown and white paper, artwork coverage and handle comfort. Bag dimensions and reinforcement matter alongside paper weight.\u003c/p>\u003ca href=\"/custom-twisted-handle-kraft-paper-bags\">View Twisted-Handle Bags\u003c/a>\u003c/article>\u003carticle class=\"priority-card\">\u003ch3>Paper bags for premium presentation\u003c/h3>\u003cp>If your project needs ribbon handles or a laminated printed finish, compare our shopping bag opti
