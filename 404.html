<!DOCTYPE html>
<html lang="en">
<head>
<script src="/icp-analytics.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Page Not Found | iColorPacks</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0a0a0f; color: #fff; font-family: Arial, sans-serif; }
    main { width: min(680px, 100%); text-align: center; padding: 64px 32px; border: 1px solid rgba(201,168,76,.35); background: #12121a; }
    .code { color: #c9a84c; font-size: 14px; letter-spacing: .2em; }
    h1 { margin: 16px 0; font-size: clamp(34px, 7vw, 64px); }
    p { color: #b8b8c2; line-height: 1.7; }
    a { display: inline-block; margin: 12px 6px 0; padding: 14px 22px; color: #0a0a0f; background: #c9a84c; text-decoration: none; font-weight: 700; }
    a.secondary { color: #fff; background: transparent; border: 1px solid #c9a84c; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The address may have changed, or the requested page may no longer be available. Continue to our packaging categories or send your project specifications for review.</p>
    <a href="/">Return to homepage</a>
    <a class="secondary" href="/#inquiry">Request a quote</a>
  </main>
</body>
</html>
