<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - iColorPacks</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --black: #0D0D0D;
      --white: #FFFFFF;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      border: 1px solid rgba(201, 168, 76, 0.3);
      background: rgba(255, 255, 255, 0.05);
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 30px;
      display: block;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--gold);
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
      color: rgba(255, 255, 255, 0.8);
    }
    .btn-home {
      display: inline-block;
      padding: 15px 40px;
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .btn-home:hover {
      background: var(--white);
    }
  
    /* WIDGETS */
    .floating-whatsapp {
      position: fixed; bottom: 40px; left: 40px; z-index: 2000;
      width: 55px; height: 55px; background: #25D366; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3); transition: 0.3s ease;
    }
    .floating-whatsapp:hover { transform: scale(1.1); }

    .floating-quote-container {
      position: fixed; bottom: 40px; right: 40px; z-index: 2000;
      display: flex; align-items: center; flex-direction: row-reverse;
      cursor: pointer;
      text-decoration: none;
    }
    .floating-quote {
      width: 55px; height: 55px; 
      background: linear-gradient(135deg, #C9A84C 0%, #E8C97A 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(201, 168, 76, 0.3);
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .floating-quote svg { width: 28px; height: 28px; fill: #0D0D0D; }
    .quote-tooltip {
      position: absolute; right: 70px; background: #FFFFFF; color: #0D0D0D;
      padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700;
      white-space: nowrap; opacity: 0; transform: translateX(20px);
      pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .floating-quote-container:hover .quote-tooltip { opacity: 1; transform: translateX(0); }
    .floating-quote-container:hover .floating-quote { transform: scale(1.1) rotate(90deg); }

  
    /* MODAL */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 3000; display: none;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #0d0d14; width: 100%; max-width: 850px; max-height: 90vh;
      overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      position: relative;
    }
    .close-modal {
      position: absolute; top: 20px; right: 20px; font-size: 30px; color: var(--text-muted);
      cursor: pointer; z-index: 10;
    }
    .modal-inner { padding: 40px; }
    
    .consultant-bar {
      background: rgba(255,255,255,0.03); padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center;
    }
    .consultant-info-mini { display: flex; align-items: center; gap: 15px; }
    .consultant-avatar-mini { 
      width: 40px; height: 40px; border-radius: 50%; background: var(--gold); 
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000;
    }
    .consultant-text h4 { font-size: 14px; color: var(--white); margin-bottom: 2px; }
    .consultant-text p { font-size: 11px; color: var(--text-muted); }
    .online-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #25D366; }
    .status-dot { width: 8px; height: 8px; background: #25D366; border-radius: 50%; box-shadow: 0 0 10px #25D366; }

    .inquiry-section-title { 
      font-size: 12px; color: var(--text-muted); text-transform: uppercase; 
      letter-spacing: 2px; margin: 30px 0 20px; display: flex; align-items: center; gap: 10px;
    }
    .inquiry-section-title span { color: var(--gold); }
    
    .luxo-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .luxo-group { display: flex; flex-direction: column; gap: 8px; }
    .luxo-group.full { grid-column: span 2; }
    .luxo-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .luxo-group input, .luxo-group select, .luxo-group textarea {
      background: #15151e; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;
      padding: 15px; color: var(--white); font-family: inherit; font-size: 14px;
      outline: none; transition: 0.3s;
    }
    .luxo-group input:focus, .luxo-group select:focus, .luxo-group textarea:focus { border-color: var(--gold); background: #1f1f2b; }
    
    .luxo-file-upload {
      border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px; padding: 30px;
      text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column;
      align-items: center; gap: 10px; background: rgba(255,255,255,0.02);
    }
    .luxo-file-upload:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }
    .luxo-file-upload svg { width: 24px; height: 24px; fill: var(--text-muted); }
    .luxo-file-upload p { font-size: 13px; color: var(--text-muted); margin: 0; }
    .luxo-file-upload span { font-size: 11px; color: var(--gold); font-weight: 700; }
    .hidden-file-input { display: none; }
    
    .request-types { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: span 2; margin-top: 10px; }
    .type-option { background: #15151e; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
    .type-option:hover { border-color: var(--gold); }
    .type-option input { display: none; }
    .radio-circle { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; }
    .type-option input:checked + .radio-circle { border-color: var(--gold); }
    .type-option input:checked + .radio-circle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; }
    .type-option span { font-size: 13px; font-weight: 700; }

    .btn-luxo-submit {
      grid-column: span 2; padding: 20px; background: var(--gold); color: var(--dark-bg);
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    .btn-luxo-submit:hover { background: #e0c27a; transform: translateY(-2px); }

        /* Navigation Dropdowns */
        .nav-links { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .nav-links a { text-decoration: none; color: #8A8A9A; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .nav-links a:hover { color: #C9A84C; }
        .nav-links li.dropdown { position: relative; }
        .btn-quote-nav { 
            border: 1px solid #C9A84C; color: #C9A84C; padding: 8px 18px; 
            font-size: 10px; font-weight: 700; transition: 0.3s; text-decoration: none; 
            letter-spacing: 2px; display: inline-block; cursor: pointer;
        }
        .btn-quote-nav:hover { background: #C9A84C; color: #0A0A0F; }
        
        .dropdown-content {
            display: none; position: absolute; background: #0D0D14;
            min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1001; top: 100%; left: 0; border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 0;
        }
        .dropdown-content a {
            color: #8A8A9A !important; padding: 12px 25px !important; text-decoration: none !important;
            display: block !important; font-size: 11px !important; text-transform: uppercase !important; letter-spacing: 1.5px !important;
            border-bottom: 1px solid rgba(255,255,255,0.03) !important; transition: 0.3s !important;
            text-align: left !important; line-height: 1.2 !important;
        }
        .dropdown-content a:last-child { border-bottom: none !important; }
        .dropdown-content a:hover { background: rgba(201, 168, 76, 0.1) !important; color: #C9A84C !important; padding-left: 30px !important; }
        .dropdown:hover .dropdown-content { display: block; }
        .arrow { font-size: 8px; margin-left: 8px; vertical-align: middle; opacity: 0.7; }

        .footer-grid { display: grid; grid-template-columns: 1.5fr repeat(2, 1fr); gap: 60px; max-width: 1200px; margin: 0 auto; }
        
        @media (max-width: 992px) {
            .menu-toggle { display: block !important; }
            .nav-links { 
                display: none; position: absolute; top: 100%; left: 0; width: 100%; 
                background: #0A0A0F; flex-direction: column; padding: 20px; 
                border-bottom: 1px solid rgba(255,255,255,0.1); 
            }
            .nav-links.active { display: flex !important; }
            .nav-links li { margin: 10px 0; width: 100%; }
            .dropdown-content { position: static; box-shadow: none; border: none; padding-left: 20px; display: none; background: transparent; }
            .dropdown.active .dropdown-content { display: block; }
        }
        @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; gap: 40px; } }

    </style>
</head>
<body>
  <div class="container">
    <a href="index" class="logo"><div class="logo-wrapper" style="display: flex; align-items: center; gap: 12px;">
          <svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Box Flaps (Top) in varying gold shades for depth -->
            <path d="M60 35 L95 20 L60 5 L25 20 Z" fill="#E8C97A" opacity="0.9"/> <!-- Back Flap -->
            <path d="M25 20 L10 45 L45 60 L60 35 Z" fill="#C9A84C"/> <!-- Left Flap -->
            <path d="M95 20 L110 45 L75 60 L60 35 Z" fill="#C9A84C"/> <!-- Right Flap -->
            <path d="M45 60 L60 85 L75 60 L60 35 Z" fill="#DBC48E"/> <!-- Front Flap -->
            
            <!-- Body with iCP Integrated (Simplified for SVG clarity) -->
            <path d="M25 55 V95 L60 115 V75 Z" fill="#C9A84C"/> <!-- Left Body -->
            <path d="M95 55 V95 L60 115 V75 Z" fill="#A6893A"/> <!-- Right Body -->
            
            <!-- iCP Stylized (Metallic Overlay) -->
            <text x="32" y="98" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#0D0D0D" style="letter-spacing:-1px;">iCP</text>
          </svg>
          <span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; color: #C9A84C; letter-spacing: 1px; text-transform: none;">iColorPacks</span>
        </div></div>
        <div class="online-status">
          <div class="status-dot"></div>
          Free sample available · Reply within 2 hours
        </div>
      </div>
      <div class="modal-inner">
        <form name="iColorPacks Website" class="luxo-form" action="https://formspree.io/f/mkoeljdw" method="POST">
          <input type="hidden" name="_subject" value="New Inquiry from iColorPacks Website">
          <input type="hidden" name="_next" value="https://www.icolorpacks.com/thank-you">
          
          <div class="luxo-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="Enter your name" required>
          </div>
          <div class="luxo-group">
            <label>Email or WhatsApp *</label>
            <input type="text" name="contact" placeholder="Email or Phone (+1...)" required>
          </div>
          
          <div class="luxo-group">
            <label>Estimated Quantity *</label>
            <select name="quantity" required>
              <option value="">Select Quantity...</option>
              <option value="100-300">100 - 300 PCS</option>
              <option value="300-500">300 - 500 PCS</option>
              <option value="500-1000">500 - 1000 PCS</option>
              <option value="1000-3000">1000 - 3000 PCS</option>
              <option value="3000+">3000+ PCS</option>
            </select>
          </div>

          <div class="luxo-group">
            <label>Product Interest</label>
            <select name="product">
              <option value="Not Specified">Select box type...</option>
              <option value="Rigid Gift Box">Rigid Gift Box</option>
              <option value="Cake / Bakery Box">Cake / Bakery Box</option>
              <option value="Luxury Paper Bag">Luxury Paper Bag</option>
              <option value="Mailer Box">Mailer Box</option>
              <option value="Kraft Bag">Kraft Paper Bag</option>
            </select>
          </div>
          
          <div class="luxo-group full">
            <label>Project Details (Size, Color, Branding)</label>
            <textarea name="details" placeholder="Tell us about your project..." rows="3" style="width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; color: #FFF; font-family: inherit; font-size: 14px;"></textarea>
          </div>
          
          <div class="luxo-group full">
            <label>Upload Logo / Reference (Optional)</label>
            <div class="luxo-file-upload" onclick="document.getElementById('file-upload').click()">
              <svg viewBox="0 0 24 24"><path d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z" /></svg>
              <p>Click to upload PNG, AI, PDF · Max 10MB</p>
              <span id="file-name">No file selected</span>
              <input type="file" id="file-upload" name="attachment" class="hidden-file-input" onchange="updateFileName(this)">
            </div>
          </div>

          <button type="submit" class="btn-luxo-submit">Get My Free Quote</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function updateFileName(input) {
      const fileName = input.files[0] ? input.files[0].name : 'No file selected';
      document.getElementById('file-name-modal').textContent = fileName;
    }

    function toggleModal() { 
      const modal = document.getElementById('inquiryModal');
      modal.classList.toggle('active');
    }
    window.onclick = function(event) { 
      const modal = document.getElementById('inquiryModal');
      if (event.target == modal) toggleModal(); 
    }
  </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
        });
    </script>

</body>
